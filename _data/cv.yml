      - company: FAIR Lab, Penn State
        position: Graduate Researcher
        location: State College, PA
        start_date: 2023-01
        end_date: 2024-12
        summary: "Advised by [Dr. Hadi Hosseini](https://faculty.ist.psu.edu/hadi/); collaborated with [Dr. Debmalya Mandal](https://debmandal.github.io/) (University of Warwick)."
        highlights:
          - "Designed scalable Surprisingly Popular (SP) voting algorithms that recover ground-truth rankings from partial preferences when experts are a minority. The best variant (Partial-SP) recovers the true ranking with a Kendall-Tau correlation about 300% higher than Copeland on votes alone (about 0.8 vs 0.2). (NeurIPS 2024)"
          - "Ran a crowdsourcing study with 432 participants on Amazon MTurk across three domains (geography, movies, paintings) of 36 alternatives each."
          - "Modeled voter behavior as concentric mixtures of Mallows and Plackett-Luce models, inferred parameters with Bayesian MCMC (No-U-Turn Sampler), and derived when SP voting recovers the ground truth with high probability. On real data, SP voting made about 83% fewer ranking errors than Copeland (Kendall-Tau distance about 0.8 vs 4.8). (NeurIPS 2024, WWW 2025)"
          - "Released SP-Rank, the first large-scale public dataset pairing personal votes with predictions of others' votes. It holds 12,384 datapoints from 1,152 participants across 9 elicitation formats, open-sourced with benchmarks showing SP voting recovers rankings with a Kendall-Tau correlation about 400% higher than Copeland on votes alone (about 0.49 vs 0.10, averaged across formats). (KDD 2026)"
          - "Used SP voting to generate preference labels for RLHF reward-model training, with weak and strong language models as voters, improving label accuracy by 9% on average over standard voting rules in preliminary experiments. (MS thesis)"
          - "Fine-tuned LLMs for multiple-choice QA with LoRA, quantization and PEFT, ranking 6th on the AI2 SWAG leaderboard with 90.98% accuracy (2024)."

